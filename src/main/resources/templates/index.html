<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/my_styles.css}" />
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

    <script type="text/javascript" th:inline="javascript">
        google.charts.load('current', {'packages':['corechart']});
        google.charts.setOnLoadCallback(drawChartTemp);

        function drawChartTemp() {
            var data = google.visualization.arrayToDataTable([[${chartData}]]);

            var options = {
                title: 'Temperature & Humidity',
                curveType: 'function',
                legend: { position: 'bottom' }
            };

            var chart = new google.visualization.LineChart(document.getElementById('curve_chart'));

            chart.draw(data, options);
        }
    </script>

    <title>Metrics</title>
</head>
<body>
    <div class="container-sm">
        <header>
            <div class="row align-items-center justify-content-between text-center">
               <div class="col-1">
                   <span class="material-icons" style="font-size: 48px;" >insights</span>
               </div>
                <div class="col-11">
                    <h1>Metrics Server</h1>
                </div>
            </div>
        </header>
        <div class="row topic">
            <h5>Last data</h5>
        </div>
        <div class="row align-items-center justify-content-center">
            <div class="col-6">
                <div id="curve_chart" style="height: 500px">chart</div>
            </div>
            <div class="col-6">
                <div>
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <td>Type</td>
                            <td>Value</td>
                            <td>Date</td>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="metric : ${metrics}">
                            <td th:text="${metric.type}">type</td>
                            <td th:text="${metric.value}">value</td>
                            <td th:text="${metric.createDate}">createDate</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="border rounded p-4 mt-4">
            <h3>Select dates</h3>
            <form action="#" th:action="@{/metrics}" th:object="${period}" method="post">
                <div class="mb-2">
                    <label for="fromDate" class="form-label">From:</label>
                    <input id="fromDate" class="form-control" type="datetime-local" th:field="*{fromDate}">
                </div>
                <div class="mb-2">
                    <label for="toDate" class="form-label">To:</label>
                    <input id="toDate" class="form-control" type="datetime-local" th:field="*{toDate}">
                </div>
                
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>
        <footer>
            <div class="row align-items-center justify-content-between text-center">
                Author: Andrii Hlazkov, 2026
            </div>
        </footer>
    </div>
</body>
</html>
